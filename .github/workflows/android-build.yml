name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The runner image already ships an Android SDK, it is just not wired into
      # the environment. Configure it directly instead of using setup-android,
      # which tries to install the legacy "tools" package that Google removed.
      - name: Configure Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          CMDLINE=$(ls -d "$SDK_ROOT"/cmdline-tools/*/ 2>/dev/null | head -1)
          echo "cmdline-tools: $CMDLINE"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "${CMDLINE}bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassSchedule-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
